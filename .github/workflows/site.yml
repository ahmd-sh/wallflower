# ahmd.sh/wallflower: site/, the installer, and the newest release's
# release.json, published on each change to them and each release.
name: site
on:
  push:
    branches: [main]
    paths: [site/**, install.sh, .github/workflows/site.yml]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Put it together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp -R site/. install.sh _site/
          gh release download --repo "$GITHUB_REPOSITORY" --pattern release.json --pattern release.json.sig --dir _site || echo "the newest release has no release.json"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
